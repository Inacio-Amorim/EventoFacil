# Publicação no Render (plano gratuito) - https://render.com
# Banco MySQL gratuito no Aiven (https://aiven.io), informado em DATABASE_URL.
# Os valores marcados com "sync: false" são digitados no painel do Render
# (nunca ficam no GitHub).
services:
  - type: web
    name: eventofacil
    runtime: python
    plan: free
    region: virginia
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python init_db.py && gunicorn --workers 2 --threads 4 --timeout 90 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/saude
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TZ
        value: America/Sao_Paulo
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: ATRAS_DE_PROXY
        value: "true"
      - key: DEMO_MOSTRAR_CODIGO
        value: "true"
      - key: DB_SSL_CA
        value: certs/aiven-ca.pem
      - key: AZURE_ENDPOINT
        value: https://2603-foundry-senai-inacio.services.ai.azure.com/api/projects/Projeto_teste
      - key: AZURE_AGENT_NAME
        value: agente-eventofacil
      - key: AZURE_API_VERSION
        value: 2025-11-15-preview
      # Segredos: preenchidos no painel do Render
      - key: DATABASE_URL
        sync: false
      - key: AZURE_API_KEY
        sync: false
      - key: ADMIN_SENHA
        sync: false
